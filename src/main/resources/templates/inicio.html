<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Tutorías - Inicio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>
<main>
    <div class="card">
        <h1>Plataforma de Tutorías Académicas Universitarias</h1>
        <p class="alerta-error" th:if="${error}" th:text="${error}"></p>
        <p>Conecta con estudiantes tutores de tu propia universidad, revisa su calificacion
           y reserva una sesion de tutoria para el curso que necesitas reforzar.</p>
        <p th:if="${nombreUsuarioActual == null}">
            <a class="btn" th:href="@{/registro}">Crear cuenta</a>
            <a class="btn btn-secundario" th:href="@{/login}">Ya tengo cuenta</a>
        </p>
        <p th:if="${nombreUsuarioActual != null}">
            <a th:unless="${esTutorActual}" class="btn" th:href="@{/buscar}">Buscar un tutor</a>
            <a th:if="${esTutorActual}" class="btn btn-secundario" th:href="@{/tutor/perfil/nuevo}">Publicar mi perfil de tutor</a>
        </p>
    </div>

    <div class="card">

            incremento.
        </p>
    </div>
-->
</main>
</body>
</html>
