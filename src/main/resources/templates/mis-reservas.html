<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis reservas - Plataforma de Tutorías</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>
<main>
    <div class="card">
        <h1>Mis reservas (como alumno)</h1>

        <div th:if="${reservas == null or reservas.isEmpty()}" class="texto-muted">
            Aun no tienes reservas. <a th:href="@{/buscar}">Busca un tutor</a> para crear una.
        </div>

        <table th:if="${reservas != null and !reservas.isEmpty()}">
            <thead>
            <tr><th>Tutor</th><th>Curso</th><th>Horario</th><th>Estado</th><th>Accion</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reservas}">
                <td th:text="${r.perfilTutor.usuario.nombre}"></td>
                <td th:text="${r.perfilTutor.curso.nombre}"></td>
                <td th:text="${#temporals.format(r.horario, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="'badge-' + ${r.estado.name().toLowerCase()}"
                          th:text="${r.estado}"></span>
                </td>
                <td class="acciones-fila">
                    <a th:if="${r.estado.name() == 'COMPLETADA'}" class="btn" th:href="@{/pagar/{id}(id=${r.idReserva})}">Pagar sesion</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
