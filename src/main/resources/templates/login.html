<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesion - Plataforma de Tutorías</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <h1 class="auth-title">Iniciar sesion</h1>
        <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>

        <p class="alerta-error" th:if="${error}" th:text="${error}"></p>
        <p class="alerta-ok" th:if="${mensaje}" th:text="${mensaje}"></p>

        <form th:action="@{/login}" method="post">
            <label for="correo">Correo</label>
            <div class="input-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" required>
            </div>

            <label for="contrasena">Contrasena</label>
            <div class="input-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 19 4m0 0h-4m4 0v4"/></svg>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
            </div>

            <button type="submit">Ingresar</button>
        </form>
        <p class="auth-footer">Aun no tienes cuenta? <a th:href="@{/registro}">Registrate aqui</a></p>
    </div>
</main>
</body>
</html>
