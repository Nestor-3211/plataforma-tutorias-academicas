<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Plataforma de Tutorías</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>
<main class="auth-page">
    <div class="auth-card auth-card--wide">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </div>
        <h1 class="auth-title">Crear cuenta</h1>
        <p class="auth-subtitle">Completa tus datos para comenzar</p>

        <p class="alerta-error" th:if="${error}" th:text="${error}"></p>
        <p class="alerta-ok" th:if="${mensaje}" th:text="${mensaje}"></p>

        <form th:action="@{/registro}" method="post">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo institucional</label>
            <div class="input-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" required>
            </div>

            <label for="contrasena">Contrasena</label>
            <div class="input-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 19 4m0 0h-4m4 0v4"/></svg>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required minlength="6">
            </div>

            <label for="tipoUsuario">Tipo de usuario</label>
            <select id="tipoUsuario" name="tipoUsuario" required>
                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
            </select>

            <label for="idUniversidad">Universidad</label>
            <select id="idUniversidad" name="idUniversidad">
                <option value="">-- Selecciona --</option>
                <option th:each="u : ${universidades}" th:value="${u.idUniversidad}" th:text="${u.nombre}"></option>
            </select>

            <button type="submit">Registrarme</button>
        </form>
        <p class="auth-footer">Ya tienes cuenta? <a th:href="@{/login}">Inicia sesion</a></p>
    </div>
</main>
</body>
</html>
